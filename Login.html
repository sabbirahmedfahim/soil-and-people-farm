<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - মাটি ও মানুষ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="split">

    <div class="split-form">

      <a class="home-btn" href="index.html">Home Page</a>

      <div class="login-box">

        <h2>Welcome back</h2>
        <p class="subtitle">Please enter your details</p>

        <form action="https://www.w3schools.com/action_page.php" method="post">

          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>

          <div class="remember-row">
            <label class="remember" for="remember">
              <input type="checkbox" id="remember" name="remember" value="30days">
              Remember for 30 days
            </label>
            <a href="#">Forgot password</a>
          </div>

          <button type="submit">Login</button>

          <button type="button" class="google-btn">
            <img src="asset/illustrations/google_icon.png" alt="">
            Login with Google
          </button>
        </form>

        <p class="note">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>

    <div class="split-image">
      <img src="asset/illustrations/login_screen_illustration.png" alt="Illustration for the login page">
    </div>

  </div>

</body>
</html>
